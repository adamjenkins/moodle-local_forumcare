name: local_forumcare
summary: A Moodle local plugin that lets students report problematic posts in `mod_forum` forums, with configurable auto-moderation (hide posts, suspend users) and a teacher review queue.
description: |
  Students report problematic posts via a link injected into every forum
  post's action menu, choosing from configurable report reasons (site-wide or
  per-course). Thresholds can auto-hide a post after N open reports and
  auto-suspend repeat offenders — counting distinct reporters, so one person
  cannot trigger it alone — with a teacher review queue behind it. Reporting is
  opt-in per forum, under a site-wide master switch.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
  #   fully-free | freemium | paid-service | external-account
  #   donation-supported | commercial-support-available
  - fully-free
