name: local_forumcare
summary: 'Lets students report problematic `mod_forum` posts, reports posts with telltale strings automatically, and adds auto-moderation (hide posts, suspend users) and a teacher review queue.'
description: |
  Students report problematic posts via a link placed first in every forum
  post's action menu (so it is not mistaken for Reply), in a dialog that
  says plainly it is a report, not a reply, choosing from configurable report
  reasons (site-wide or per-course). AutoReport can also report posts
  automatically: give a reason telltale strings such as "As an AI" or a banned
  word, and a scheduled task checks each new post once and files a report when
  one matches. Thresholds can auto-hide a post after N open reports and
  auto-suspend repeat offenders (counting distinct reporters, so one person
  cannot trigger it alone), with a teacher review queue behind it, filterable
  by forum, people and report type. Reporting is opt-in per forum, under a
  site-wide master switch.
